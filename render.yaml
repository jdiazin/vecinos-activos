services:
  - type: web
    name: vecinos-activos
    env: php
    plan: free
    buildCommand: "composer install --optimize-autoloader --no-dev && npm install && npm run build"
    startCommand: "php artisan config:cache && php artisan route:cache && apache2-foreground"
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: true
      - key: APP_ENV
        value: production